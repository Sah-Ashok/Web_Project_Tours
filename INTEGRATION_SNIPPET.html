<!-- 
=============================================================================
QUICK INTEGRATION SNIPPET FOR HOME.ASPX
Copy and paste these sections into your Home.aspx file
=============================================================================
-->

<!-- ========================================= -->
<!-- STEP 1: Add to <head> ContentPlaceHolder -->
<!-- ========================================= -->
<asp:Content ID="Content1" ContentPlaceHolderID="head" runat="server">
    <!-- Existing Google Fonts, Font Awesome, etc. -->
    
    <!-- ADD THIS LINE: Modern Hero Section Styles -->
    <link rel="stylesheet" href="CSS/modern-hero.css" />
</asp:Content>

<!-- ========================================= -->
<!-- STEP 2: Replace Hero Section in <main>   -->
<!-- Find the section with id="home" and      -->
<!-- replace it with the content from         -->
<!-- modern-hero-section.html                 -->
<!-- ========================================= -->
<asp:Content ID="Content2" ContentPlaceHolderID="ContentPlaceHolder1" runat="server">
    <main>
      <!-- =============================================== -->
      <!-- MODERN IMMERSIVE HERO SECTION                -->
      <!-- Copy entire content from modern-hero-section.html -->
      <!-- =============================================== -->
      
      <!-- Keep your existing sections below: -->
      <!-- How It Works Section -->
      <!-- Famous Destinations Section -->
      <!-- Why Us Section -->
      <!-- Testimonials Section -->
      <!-- Newsletter Section -->
    </main>

    <!-- ========================================= -->
    <!-- STEP 3: Add JavaScript before closing     -->
    <!-- Place this AFTER all other content        -->
    <!-- ========================================= -->
    
    <!-- Existing Hero Video Background Script (can remove if replacing) -->
    
    <!-- ADD THIS: Modern Hero JavaScript -->
    <script src="JS/modern-hero.js"></script>
</asp:Content>

<!-- 
=============================================================================
ALTERNATIVE: If using Master Page Script ContentPlaceHolder
=============================================================================
-->
<asp:Content ID="Content3" ContentPlaceHolderID="script" runat="server">
    <script src="JS/modern-hero.js"></script>
</asp:Content>
